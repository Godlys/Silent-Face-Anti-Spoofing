name: Convert MiniFASNet to TFLite

on:
  workflow_dispatch: # 支持网页手动一键触发
  push:
    branches: [ master, main ]

jobs:
  convert-to-tflite:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.10 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 PyTorch 与基础库
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision onnx onnxscript onnxruntime tensorflow tf-keras

      - name: 安装 NVIDIA GraphSurgeon
        run: |
          pip install onnx_graphsurgeon --extra-index-url https://pypi.ngc.nvidia.com
          
      - name: 安装 onnx2tf
        run: |
          pip install onnx2tf

      - name: 导出为 ONNX
        run: python export_tflite.py

      - name: 压制转换为 TFLite (自动适配 NHWC 维度)
        run: |
          onnx2tf -i MiniFASNetV2.onnx -o tflite_output

      - name: 上传 TFLite 模型产物
        uses: actions/upload-artifact@v4
        with:
          name: mini-fasnet-tflite-models
          path: tflite_output/*.tflite
